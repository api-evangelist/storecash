aid: storecash
name: StoreCash
description: >-
  StoreCash, operated by G Cards, Inc., is a Los Angeles-based cashback and
  payments company whose mobile app (iOS and Android) lets shoppers earn instant,
  unlimited cashback on everyday purchases at hundreds of online and in-store
  retailers. Users buy a store card for a purchase amount, receive cashback
  immediately, then redeem the digital card at checkout like a gift card. The
  product works with debit and credit cards, stacks with existing store promos,
  and offers sign-up, referral, and birthday bonuses under a free-trial-then-
  subscription model. StoreCash also markets a plug-and-play cashback API to
  businesses and banks to power their own loyalty and engagement, though that
  B2B API is contact-sales only and not publicly documented. The public website
  is Wix-hosted and exposes a Wix Site MCP endpoint for agentic AI access.
